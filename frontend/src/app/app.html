<div class="app-layout">
  <header class="app-header">
    <div class="header-container">
      <a routerLink="/dashboard" class="brand">
        <span class="brand-icon">💰</span>
        <span class="brand-name">control-gastos</span>
      </a>
      <nav class="nav-links">

        <ng-container *ngIf="!authService.isLoggedIn()">
          <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
          <a routerLink="/register" routerLinkActive="active">Registro</a>
        </ng-container>
        <ng-container *ngIf="authService.isLoggedIn()">
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          <a *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="active">Administración</a>
          <button (click)="authService.logout()" class="nav-btn-logout">Salir</button>
        </ng-container>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 control-gastos. Fase 6 — Autorización por roles ADMIN y USER</p>
  </footer>
</div>
