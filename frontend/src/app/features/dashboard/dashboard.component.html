<div class="dashboard-container">
  <div class="card">
    <div class="header">
      <span class="app-title">CONTROL DE GASTOS</span>
      <h1>Dashboard</h1>
    </div>

    <div *ngIf="loading" class="loading-state">
      <p>Cargando información del usuario...</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="!loading && currentUser" class="user-profile">
      <h2>Bienvenido, {{ currentUser.name }}</h2>
      
      <div class="info-grid">
        <div class="info-item">
          <span class="label">Correo:</span>
          <span class="value">{{ currentUser.email }}</span>
        </div>
        <div class="info-item">
          <span class="label">Rol:</span>
          <span class="value font-bold" [class.admin-text]="currentUser.role === 'ADMIN'" [class.user-text]="currentUser.role === 'USER'">
            {{ currentUser.role }}
          </span>
        </div>
        <div class="info-item">
          <span class="label">Estado:</span>
          <span class="value status-online">Sesión autenticada correctamente</span>
        </div>
      </div>

      <div class="actions">
        <button (click)="logout()" class="btn btn-danger">Cerrar sesión</button>
      </div>
    </div>
  </div>
</div>
